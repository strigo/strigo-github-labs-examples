## Class lab resources and exercises - simple configuration for a single class
##
## A lab resource's kind is derived from its definition field: `aws_vm_definition` for an inline
## VM, `lab_library_item_id` for an item from the lab library. `platform_type` is deprecated and
## no longer declared - see the README's "Deprecated Fields".
---
classes:
  - lab_resources:
      - display_name: "AWS EC2 Instance"
        image_platform: "linux"
        view_interface: "desktop"
        cloud_provider: "aws"
        aws_vm_definition:
          machine_size: "t3.medium"
          ami_region_mapping:
            eu-west-1:
              image_id: "ami-0b32f4a77e48fcb24"
          custom_username: "ec2-user"
          custom_password: "password123"
    exercises:
      - file: "../hello-world/hello.md"
        title: "Hello!"
        syntax: "md"
      - file: "../hello-world/world.md"
        title: "World!"
        syntax: "md"

