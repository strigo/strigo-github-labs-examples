## Class lab resources using lab library items
##
## Reference a VM or a cloud account saved in your lab library. The library item holds the
## configuration - for a cloud account that includes its cloud provider, region, the permissions
## learners get and anything provisioned into the account - so nothing but its ID is needed here.
## Do not add `platform_type`: it is derived from the library item.
# ---
# classes:
#   - lab_resources:
#       - display_name: "Pre-configured Ubuntu VM"
#         lab_library_item_id: "<your_lab_library_vm_id>"
#       - display_name: "AWS Sandbox Account"
#         lab_library_item_id: "<your_lab_library_cloud_account_id>"
#     exercises:
#       - file: "../hello-world/hello.md"
#         title: "Hello!"
#         syntax: "md"
